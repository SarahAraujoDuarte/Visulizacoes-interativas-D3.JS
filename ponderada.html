<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mapa + Grafo: Rastreamento SP</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f0f2f5;}

#controls{padding:10px;text-align:center;background:white;border-bottom:1px solid #ccc;}
#container{display:flex;}
#mapa-grafo{flex:1;}

svg{background:white;cursor:grab;}
svg:active{cursor:grabbing;}

.distrito{fill:#e0e0e0;stroke:white;stroke-width:0.5px;}
.link{stroke:#ff5722;stroke-width:2px;stroke-opacity:0.7;}

.node{stroke:white;stroke-width:1.5px;cursor:pointer;}
.label{fill:white;font-size:11px;font-weight:bold;pointer-events:none;}

#legenda,#tabela{background:white;border-left:1px solid #ccc;padding:15px;}
#legenda{width:200px;}
#tabela{width:320px;overflow-y:auto;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px;border-bottom:1px solid #ddd;text-align:center;}
th{background:#fafafa;}

#info{
position:absolute;background:white;border:1px solid #ccc;
padding:12px;border-radius:6px;
box-shadow:0 2px 8px rgba(0,0,0,0.15);
display:none;
}

#closePopup{
position:absolute;top:4px;right:6px;
cursor:pointer;font-weight:bold;
}

.brush .selection{
fill:rgba(0,150,255,0.2);
stroke:#0096ff;
}
</style>
</head>

<body>

<div id="controls">
<select id="recursoFiltro">
<option value="todos">Todos</option>
<option value="brigadista">Brigadista</option>
<option value="caminhao">Caminhão</option>
<option value="veiculo">4x4</option>
</select>
</div>

<div id="container">
<div id="mapa-grafo"></div>

<div id="legenda">
<h3>Legenda</h3>
<p>🔵 Rastreador</p>
<p>🔴 Ocorrência</p>
<p>SHIFT + arrastar → selecionar</p>
</div>

<div id="tabela">
<h3>Despacho</h3>
<table id="conexoesTable">
<thead>
<tr><th>Destino</th><th>Origem</th><th>Recurso</th><th>Qtd</th></tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>

<div id="info"></div>

<script>

const width = window.innerWidth * 0.6;
const height = window.innerHeight * 0.9;

const svg = d3.select("#mapa-grafo")
.append("svg")
.attr("width",width)
.attr("height",height);

const g = svg.append("g");

// ✅ ZOOM
const zoom = d3.zoom()
.scaleExtent([1,6])
.translateExtent([[-100,-100],[width+100,height+100]])
.on("zoom", (event)=> g.attr("transform", event.transform));

svg.call(zoom).on("dblclick.zoom", null);

let filtroAtual="todos";

// seta
svg.append("defs")
.append("marker")
.attr("id","arrow")
.attr("viewBox","0 -5 10 10")
.attr("refX",22)
.attr("refY",0)
.attr("markerWidth",6)
.attr("markerHeight",6)
.attr("orient","auto")
.append("path")
.attr("d","M0,-5L10,0L0,5")
.attr("fill","#ff5722");

// dados
const pontos=[
{id:"R1",type:"rastreador",coords:[-46.6333,-23.5505],recursos:{brigadista:8,caminhao:2,veiculo:3}},
{id:"R2",type:"rastreador",coords:[-46.6900,-23.5700],recursos:{brigadista:4,caminhao:5,veiculo:2}},
{id:"R3",type:"rastreador",coords:[-46.5300,-23.5400],recursos:{brigadista:6,caminhao:1,veiculo:4}},
{id:"R4",type:"rastreador",coords:[-46.6500,-23.6500],recursos:{brigadista:3,caminhao:3,veiculo:5}},
{ id:"O1", type:"ocorrencia", coords:[-46.6200,-23.5800]},
{ id:"O2", type:"ocorrencia", coords:[-46.7000,-23.6200]},
{ id:"O3", type:"ocorrencia", coords:[-46.5800,-23.4500]}
];

const conexoes=[
{source:"R1",target:"O1",recurso:"brigadista",qtd:4},
{source:"R2",target:"O2",recurso:"caminhao",qtd:2},
{source:"R3",target:"O3",recurso:"veiculo",qtd:3},
{source:"R4",target:"O1",recurso:"brigadista",qtd:1},
{source:"R2",target:"O1",recurso:"caminhao",qtd:3},
{source:"R1",target:"O3",recurso:"veiculo",qtd:2}
];

d3.json("saopaulo_subprefeituras_poligonos.geojson").then(geojson=>{

const projection=d3.geoMercator().fitSize([width,height],geojson);
const pathGenerator=d3.geoPath().projection(projection);

// mapa
g.append("g")
.selectAll("path")
.data(geojson.features)
.enter()
.append("path")
.attr("class","distrito")
.attr("d",pathGenerator);

const linkGroup = g.append("g");

// nós
const nodes = g.append("g")
.selectAll("circle")
.data(pontos)
.enter()
.append("circle")
.attr("class","node")
.attr("cx",d=>projection(d.coords)[0])
.attr("cy",d=>projection(d.coords)[1])
.attr("fill",d=>d.type==="rastreador"?"#3498db":"#e74c3c")
.attr("r",8)


// estado de seleção
let selectedNodes = new Set();

nodes.on("click",(event,d)=>{
    event.stopPropagation();

    // SHIFT = seleção múltipla
    if(event.shiftKey){
        if(selectedNodes.has(d.id)){
            selectedNodes.delete(d.id);
        }else{
            selectedNodes.add(d.id);
        }

        atualizarSelecao();
        return;
    }

    // clique normal (popup)
    if(d.type!=="rastreador") return;

    const t = d3.zoomTransform(svg.node());
    let [x,y]=projection(d.coords);

    x = t.applyX(x);
    y = t.applyY(y);

    mostrarInfo(d,x,y);
});

// limpa seleção ao clicar fora
svg.on("click",()=>{
    selectedNodes.clear();
    atualizarSelecao();
});

function atualizarSelecao(){
    nodes
    .attr("stroke", d => selectedNodes.has(d.id) ? "yellow":"white")
    .attr("stroke-width", d => selectedNodes.has(d.id) ? 3:1.5);
}

// labels
g.append("g")
.selectAll("text")
.data(pontos)
.enter()
.append("text")
.attr("class","label")
.attr("x",d=>projection(d.coords)[0])
.attr("y",d=>projection(d.coords)[1])
.attr("text-anchor","middle")
.attr("dominant-baseline","middle")
.text(d=>d.id);

// QUADTREE
const quadtree = d3.quadtree()
.x(d => projection(d.coords)[0])
.y(d => projection(d.coords)[1])
.addAll(pontos);

// BRUSH

// camada do brush (fica atrás dos nós)
const brushLayer = g.insert("g", ":first-child")
.attr("class","brush");

// cria brush
const brush = d3.brush()
.extent([[0,0],[width,height]])
.filter(event => event.shiftKey)
.on("start", () => {
    // desativa clique enquanto seleciona
    nodes.style("pointer-events","none");
})
.on("brush end",(event)=>{

    if(!event.selection){
        nodes
        .style("pointer-events","all")
        .attr("stroke","white")
        .attr("stroke-width",1.5);
        return;
    }

    const [[x0,y0],[x1,y1]] = event.selection;
    const t = d3.zoomTransform(svg.node());

    const selected=[];

    quadtree.visit((node,xMin,yMin,xMax,yMax)=>{

        if(xMax<x0||xMin>x1||yMax<y0||yMin>y1) return true;

        if(!node.length){
            do{
                const d=node.data;
                let [x,y]=projection(d.coords);

                x = t.applyX(x);
                y = t.applyY(y);

                if(x>=x0&&x<=x1&&y>=y0&&y<=y1){
                    selected.push(d);
                }
            }while(node=node.next);
        }
        return false;
    });

    nodes
    .attr("stroke", d => selected.includes(d) ? "yellow":"white")
    .attr("stroke-width", d => selected.includes(d) ? 3:1.5)
    .style("pointer-events","all"); // reativa clique
});

// aplica brush
brushLayer.call(brush);

// grafo
function updateGraph(){
let dados = filtroAtual==="todos"
? conexoes
: conexoes.filter(d=>d.recurso===filtroAtual);

linkGroup.selectAll("line").remove();

linkGroup.selectAll("line")
.data(dados)
.enter()
.append("line")
.attr("class","link")
.attr("marker-end","url(#arrow)")
.attr("x1",d=>projection(pontos.find(p=>p.id===d.source).coords)[0])
.attr("y1",d=>projection(pontos.find(p=>p.id===d.source).coords)[1])
.attr("x2",d=>projection(pontos.find(p=>p.id===d.target).coords)[0])
.attr("y2",d=>projection(pontos.find(p=>p.id===d.target).coords)[1]);

updateTabela(dados);
}

function updateTabela(dados){
const tbody=d3.select("#conexoesTable tbody");
tbody.html("");
dados.forEach(d=>{
tbody.append("tr").html(`
<td>${d.target}</td>
<td>${d.source}</td>
<td>${d.recurso}</td>
<td>${d.qtd}</td>
`);
});
}

function mostrarInfo(d,x,y){
const info=d3.select("#info");

info.style("display","block")
.style("left",(x+20)+"px")
.style("top",(y-10)+"px")
.html(`
<div id="closePopup">✖</div>
<b>${d.id}</b><br>
Brigadistas: ${d.recursos.brigadista}<br>
Caminhões: ${d.recursos.caminhao}<br>
4x4: ${d.recursos.veiculo}
`);

d3.select("#closePopup").on("click",()=>{
info.style("display","none");
});
}

d3.select("#recursoFiltro").on("change",function(){
filtroAtual=this.value;
updateGraph();
});

updateGraph();

});

</script>

</body>
</html>
